name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist_script: dist:mac
          - os: windows-latest
            dist_script: dist:win

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected_tag" >&2
            exit 1
          fi

          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/${default_branch}"; then
            echo "Release tag $GITHUB_REF_NAME points to a commit that is not on ${default_branch}" >&2
            exit 1
          fi

      - run: npm ci

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Verify FFmpeg tools
        run: |
          ffmpeg -version
          ffprobe -version

      - run: npm run verify

      - run: npm run ${{ matrix.dist_script }}

      - name: Verify macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          mount_dir="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg_path"
          trap 'hdiutil detach "$mount_dir"' EXIT
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ffmpeg_path="$app_path/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          test -x "$ffmpeg_path"
          "$ffmpeg_path" -version

      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Windows installer was not created.'
          }

          $appPath = 'dist/win-unpacked/Screen Region Recorder.exe'
          $ffmpegPath = 'dist/win-unpacked/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe'
          if (-not (Test-Path $appPath -PathType Leaf)) {
            throw "Packaged app executable is missing: $appPath"
          }
          if (-not (Test-Path $ffmpegPath -PathType Leaf)) {
            throw "Packaged FFmpeg is missing: $ffmpegPath"
          }

          & $ffmpegPath -version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged FFmpeg failed with exit code $LASTEXITCODE"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=( ./*.dmg ./*.exe )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
          fi
