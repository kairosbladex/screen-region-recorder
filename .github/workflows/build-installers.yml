name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist_script: dist:mac
          - os: windows-latest
            dist_script: dist:win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Verify FFmpeg tools
        run: |
          ffmpeg -version
          ffprobe -version

      - run: npm run verify

      - run: npm run ${{ matrix.dist_script }}

      - name: Verify macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          mount_dir="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg_path"
          trap 'hdiutil detach "$mount_dir"' EXIT
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          test -x "$app_path/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=( ./*.dmg ./*.exe )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
          fi
